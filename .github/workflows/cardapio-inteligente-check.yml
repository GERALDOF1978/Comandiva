name: Dishy experimental menu checks
on:
  push:
    branches:
      - feat/cardapio-inteligente
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nova-Plataforma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Nova-Plataforma/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
