name: Dishy experimental menu checks
on:
  push:
    branches:
      - feat/cardapio-inteligente
      - feat/montagem-cliente-igual-pdv
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nova-Plataforma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
